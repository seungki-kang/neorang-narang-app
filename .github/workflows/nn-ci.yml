name: NN CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nn-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  host-tests:
    name: Analysis and tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Analyze, test, coverage and shuffled tests
        shell: pwsh
        run: ./tool/Invoke-NN-CI.ps1 -Mode Tests
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nn-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-tests/
          if-no-files-found: warn
          retention-days: 14

  android-debug:
    name: Android debug build
    needs: host-tests
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build debug APK without installation
        shell: pwsh
        run: ./tool/Invoke-NN-CI.ps1 -Mode Apk
      - name: Save build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nn-build-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/ci-apk/
          if-no-files-found: warn
          retention-days: 14
